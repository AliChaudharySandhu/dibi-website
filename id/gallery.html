<!doctype html>
<html lang="en">

<head>
    <!-- Base path so all relative links work on GitHub Pages -->
    <base href="/dibi-website/">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acara | DIBI</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <!-- Bootstrap links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- Global theme (variables + base typography) -->
    <link rel="stylesheet" href="assets/css/global.css">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/styles.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script defer>
        window.addEventListener('load', function () {
            if (window.GLightbox) GLightbox({ touchNavigation: true, loop: true });
        });
    </script>

</head>

<body id="top">
    <!-- Navbar (injected) -->
    <div id="navbar" data-include="navbar-id"></div>

    <main class="py-5">
        <div class="container">
            <h1 class="mb-4">Galeri</h1>
            <div id="gallery-container" aria-live="polite"></div>
        </div>
    </main>

    <!-- Footer (injected) -->
    <div id="footer" data-include="footer-id"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js" defer></script>
    <script src="/assets/js/include.js" defer></script>
    <script src="assets/js/events.js" defer></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => { initAlbums('id'); });
    </script>
</body>


</html>
