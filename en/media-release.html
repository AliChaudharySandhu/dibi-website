<!doctype html>
<html lang="en">

<head>
    <!-- Base path so all relative links work on GitHub Pages -->
    <base href="/dibi-website/">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Media releases | DIBI</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <!-- Bootstrap links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- Global theme (variables + base typography) -->
    <link rel="stylesheet" href="assets/css/global.css">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <!-- Navbar (injected) -->
    <div id="navbar" data-include="navbar"></div>

    <main class="py-5">
        <div class="container">
            <header class="mb-4 d-flex align-items-center justify-content-between">
                <h1 class="h3 mb-0">Media releases</h1>
                <a class="btn btn-outline-secondary btn-sm" href="en/events.html">All events</a>
            </header>

            <!-- Empty state -->
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 d-flex gap-3 align-items-start">
                    <div class="badge bg-secondary-subtle text-secondary fw-semibold rounded-3 p-2">Media</div>
                    <div>
                        <h2 class="h5 mb-1">No media releases yet</h2>
                        <p class="text-muted mb-3">Please check back soon. Media statements will be published here when
                            available.</p>
                        <div class="d-flex gap-2">
                            <a class="btn btn-primary btn-sm" href="en/index.html">Back to home</a>
                            <a class="btn btn-outline-secondary btn-sm" href="en/events.html">Browse events</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Placeholder list for future items -->
            <div id="media-list" class="mt-4"></div>
        </div>
    </main>

    <!-- Footer (injected) -->
    <div id="footer" data-include="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="assets/js/include.js" defer></script>
</body>

</html>
