<!doctype html>
<html lang="en">

<head>
    <!-- Base path so all relative links work on GitHub Pages -->
  

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Events | DIBI</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- Bootstrap links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- Global theme (variables + base typography) -->
    <link rel="stylesheet" href="../assets/css/global.css">

    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/styles.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script defer>
        window.addEventListener('load', function () {
            if (window.GLightbox) GLightbox({ touchNavigation: true, loop: true });
        });
    </script>

</head>

<body id="top">
    <!-- Navbar (injected) -->
    <div id="navbar"></div>

    <main class="py-5">
        <div class="container">
            <h1 class="mb-4">Events</h1>

            <!-- Jakarta — highlights -->
            <section class="mb-5" id="event-jakarta-2024">
                <h2 class="h5 mb-1">Jakarta Launch</h2>
                <p class="text-muted mb-3">Jakarta, Indonesia • 08/2025</p>
                <div class="row g-3">
                    <!-- Show 3–6 highlights (use *_thumb.webp if you made thumbs) -->
                    <div class="col-6 col-md-4">
                        <a href="../assets/images/events/jakarta/jakarta_001.webp" class="glightbox"
                            data-gallery="jakarta-2024" data-title="Jakarta Launch — Photo 1">
                            <img class="img-fluid rounded shadow-sm" loading="lazy"
                                src="../assets/images/events/jakarta/jakarta_001_thumb.webp" alt="Jakarta Launch Photo 1">
                        </a>
                    </div>
                    <div class="col-6 col-md-4">
                        <a href="../assets/images/events/jakarta/jakarta_005.webp" class="glightbox"
                            data-gallery="jakarta-2024" data-title="Jakarta Launch — Photo 2">
                            <img class="img-fluid rounded shadow-sm" loading="lazy"
                                src="../assets/images/events/jakarta/jakarta_005_thumb.webp" alt="Jakarta Launch Photo 2">

                    <div class="col-6 col-md-4">
                        <a href="../assets/images/events/jakarta/jakarta_001.webp" class="glightbox"

                                src="../assets/images/events/jakarta/jakarta_001_thumb.webp" alt="Jakarta Launch Photo 3">

                    </div>
                </div>
                <div class="mt-3">
                    <a href="../en/gallery.html#album-jakarta-2025" class="btn btn-outline-primary btn-sm">View full album
                        →</a>
                </div>
            </section>

            <!-- Signup — highlights -->
            <section class="mb-5" id="album-signup-2024">
                <h2 class="h5 mb-1">Signup Ceremony</h2>
                <p class="text-muted mb-3">Canberra (UC), Australia • 11/2024</p>
                <div class="row g-3">
                    <div class="col-6 col-md-4">
                        <a href="../assets/images/events/koneski-signup-ceremony/signup-event_001.webp" class="glightbox"
                            data-gallery="koneski-signup-2024" data-title="Koneski Signup Ceremony — Photo 1">
                            <img class="img-fluid rounded shadow-sm" loading="lazy"
                                src="../assets/images/events/koneski-signup-ceremony/signup-event_001_thumb.webp"
                                alt="Koneski Signup Ceremony Photo 1">
                        </a>
                    </div>
                    <div class="col-6 col-md-4">
                        <a href="../assets/images/events/koneski-signup-ceremony/signup-event_002.webp" class="glightbox"
                            data-gallery="koneski-signup-2024" data-title="Koneski Signup Ceremony — Photo 2">

                <div class="mt-3">
                    <a href="../en/gallery.html#album-signup-2024" class="btn btn-outline-primary btn-sm">View full album

        </div>
    </main>

    <!-- Footer (injected) -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js" defer></script>
    <script src="../assets/js/include.js" defer></script>
